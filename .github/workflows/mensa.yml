name: Post Mensa menu

on:
  schedule:
    # Target is 10:00 Europe/Berlin (08:00 UTC summer, 09:00 UTC winter). GitHub delays or drops
    # scheduled runs, so fire every 30 min (off the top of the hour) as retries. The gate step
    # only lets runs at 10-11 Berlin time through and the cache marker keeps it to one post a day.
    - cron: '7,37 8-10 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Menu date (YYYY-MM-DD), empty for today'
        required: false
        default: ''

concurrency:
  group: mensa-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate (Berlin time + manual override)
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          echo "date=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = 10 ] || [ "$hour" = 11 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Berlin hour is $hour, skipping."
          fi

      # "Posted today" marker so retry triggers never post twice. Manual runs without a custom date set it too.
      - name: Check if already posted today
        id: posted
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .posted
          key: mensa-posted-${{ steps.gate.outputs.date }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true' && steps.posted.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Post menu
        if: steps.gate.outputs.run == 'true' && steps.posted.outputs.cache-hit != 'true'
        run: node src/index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE: ${{ inputs.date }}

      - name: Mark as posted
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.date == '') && steps.posted.outputs.cache-hit != 'true'
        run: date -u > .posted
      - uses: actions/cache/save@v4
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.date == '') && steps.posted.outputs.cache-hit != 'true'
        with:
          path: .posted
          key: mensa-posted-${{ steps.gate.outputs.date }}
