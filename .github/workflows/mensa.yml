name: Post Mensa menu

on:
  # No schedule: cronjob.com triggers this via workflow_dispatch (GitHub's own cron is delayed or dropped).
  # The gate step only lets runs at 9-13 Berlin time through, so the menu is first posted from 09:00 on
  # instead of right after midnight. The first run of the day posts, later runs only edit that post if
  # the Mensa changed the menu (state is kept in the Actions cache).
  workflow_dispatch:
    inputs:
      date:
        description: 'Menu date (YYYY-MM-DD), empty for today'
        required: false
        default: ''

concurrency:
  group: mensa-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate (Berlin time + explicit date override)
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          echo "date=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.date }}" ] || [ "$hour" -ge 9 -a "$hour" -le 13 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Berlin hour is $hour, skipping."
          fi

      # Remembers which messages were posted today and with which menu, so every later run edits them
      # instead of posting again. API/manual runs without a custom date share it (e.g. cronjob.com
      # re-checking the menu); a custom date always posts fresh and keeps no state.
      - name: Restore today's state
        if: steps.gate.outputs.run == 'true' && inputs.date == ''
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: mensa-state-${{ steps.gate.outputs.date }}-restore
          restore-keys: mensa-state-${{ steps.gate.outputs.date }}-

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24

      - name: Post or update menu
        id: post
        if: steps.gate.outputs.run == 'true'
        run: node src/index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE: ${{ inputs.date }}
          STATE_FILE: ${{ inputs.date == '' && '.state.json' || '' }}

      # Cache keys are immutable, so every change gets its own key; restore picks the newest one.
      - uses: actions/cache/save@v4
        if: steps.post.outputs.changed == 'true'
        with:
          path: .state.json
          key: mensa-state-${{ steps.gate.outputs.date }}-${{ github.run_id }}
